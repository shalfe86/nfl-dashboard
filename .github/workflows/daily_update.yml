name: NFL Data Sync (Twice Daily)

on:
  schedule:
    # Run at 5:00 AM EST (10 UTC) and 5:00 PM EST (22 UTC)
    - cron: '0 10,22 * * *'
  
  # Allow running manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      # --- STEP 1: GET RAW DATA ---
      - name: 1. Run Ingestion (Raw Data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/ingest_nfl_data.py

      # --- STEP 2: CALCULATE POWER RANKINGS ---
      - name: 2. Run Grading System (Power/QB/Defense)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/grade_players.py

      # --- STEP 3: SIMULATE PLAYOFFS ---
      - name: 3. Run Playoff Machine (Odds)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/calculate_playoff_odds.py